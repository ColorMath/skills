name: CI

# The skills repo has no gate suite of its own. The gates in ColorMath/ci run
# against `example/`, a compliant Python consumer; there is nothing here to lint
# but Markdown and two small JSON manifests.
#
# That makes the checks below more load-bearing than they look, not less.
# Consumers do NOT pin this repo: `.claude/settings.json` names the marketplace
# and no ref. An install moves when the version number changes, so a bad merge
# does not reach anybody by itself — but **`cut.sh` validates nothing**, so the
# next release publishes whatever is on main. These jobs run on the PR because
# that is the last point where a malformed plugin.json is still cheap.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The version this repo writes down must agree with the newest reachable tag,
  # and that tag must exist. Weaker consequences than in ColorMath/ci — nothing
  # resolves this version to fetch a script — but it is what keeps the version a
  # user sees in `/plugin` honest against the changelog entry describing it.
  #
  # Safe to block: it can only fail on a PR that edited a version string. A PR
  # touching none of them inherits main's consistent state and passes.
  release-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # verify.sh compares the stamp against the newest reachable tag.
          fetch-depth: 0
      - run: ./release/verify.sh

  # Both manifests must parse and describe what is actually on disk. Claude Code
  # fails quietly on a malformed manifest — the plugin simply does not appear —
  # so nothing downstream would report this.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./release/check-manifests.sh

  # The stamper, rehearsed. Neither job above runs cut.sh or stamp.sh, and that
  # gap shipped a real bug: write_plugin_version used the BSD `sed -i ''` form,
  # which GNU sed reads as an empty script followed by a filename, so the
  # Release workflow - ubuntu-latest - could not stamp at all. It went unnoticed
  # because the one release cut after it was cut by hand on a Mac.
  #
  # So this runs the stamper on a throwaway version and reads back what it
  # wrote. It mutates the checkout and commits nothing; the runner is discarded.
  # Cheap, and the only thing here that exercises the release path before a
  # human dispatches it for real.
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./release/stamp.sh v99.99.99 --date 2099-01-01
      - name: The stamp reached both sites
        run: |
          grep -q '"version": "99.99.99"' plugin/.claude-plugin/plugin.json
          grep -q '^## v99.99.99 — 2099-01-01$' CHANGELOG.md
          grep -q '^## Unreleased$' CHANGELOG.md
